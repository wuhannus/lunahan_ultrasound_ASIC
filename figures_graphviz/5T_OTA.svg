<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="800" height="1040">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1a1a1a; }
      .label { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
      .small { font-size: 10px; fill: #888; font-style: italic; }
      .vdd { font-size: 14px; font-weight: bold; fill: #cc0000; }
      .vout { font-size: 14px; font-weight: bold; fill: #cc0000; }
      .pmos rect { fill: #fff; stroke: #1a1a1a; stroke-width: 2; }
      .nmos rect { fill: #eee; stroke: #1a1a1a; stroke-width: 2; }
      .wire { stroke: #1a1a1a; stroke-width: 2; fill: none; }
      .wire-vdd { stroke: #cc0000; stroke-width: 3; fill: none; }
      .wire-gate { stroke: #006600; stroke-width: 2; fill: none; }
      .gnd { stroke: #1a1a1a; stroke-width: 2; fill: none; stroke-linecap: round; }
    </style>
    <!-- PMOS transistor symbol -->
    <g id="pmos">
      <rect x="-22" y="-30" width="44" height="56" rx="1"/>
      <line x1="0" y1="-30" x2="0" y2="-42"/>
      <line x1="0" y1="26" x2="0" y2="42"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
      <circle cx="-32" cy="0" r="2" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
    </g>
    <!-- NMOS transistor symbol -->
    <g id="nmos">
      <rect x="-22" y="-30" width="44" height="56" rx="1" fill="#eee"/>
      <line x1="0" y1="-30" x2="0" y2="-42"/>
      <line x1="0" y1="26" x2="0" y2="42"/>
      <line x1="-30" y1="0" x2="-22" y2="0"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="400" height="520" fill="#fff"/>

  <!-- Title -->
  <rect x="50" y="12" width="300" height="36" rx="3" fill="#e8f0fe" stroke="#2d5aa0" stroke-width="1.5"/>
  <text x="200" y="35" text-anchor="middle" class="title">5-Transistor OTA Schematic</text>

  <!-- VDD Rail -->
  <line x1="30" y1="65" x2="370" y2="65" class="wire-vdd"/>
  <text x="380" y="62" text-anchor="start" class="vdd">VDD</text>

  <!-- PMOS M1 (left diff pair) -->
  <use href="#pmos" x="90" y="145"/>
  <text x="90" y="197" text-anchor="middle" class="label">M1</text>
  <!-- VDD to M1 source -->
  <line x1="90" y1="65" x2="90" y2="115" class="wire"/>

  <!-- PMOS M2 (right diff pair) -->
  <use href="#pmos" x="230" y="145"/>
  <text x="230" y="197" text-anchor="middle" class="label">M2</text>
  <!-- VDD to M2 source -->
  <line x1="230" y1="65" x2="230" y2="115" class="wire"/>

  <!-- M1 Gate input -->
  <line x1="40" y1="145" x2="68" y2="145" class="wire"/>
  <text x="30" y="140" text-anchor="end" class="label">Vin-</text>

  <!-- M2 Gate input -->
  <line x1="252" y1="145" x2="290" y2="145" class="wire"/>
  <text x="310" y="140" text-anchor="start" class="label">Vin+</text>

  <!-- M1 Drain to M3 -->
  <line x1="90" y1="171" x2="90" y2="255" class="wire"/>
  <!-- M2 Drain to M4 -->
  <line x1="230" y1="171" x2="230" y2="255" class="wire"/>

  <!-- Cross-connection from drains to tail -->
  <line x1="90" y1="180" x2="160" y2="180" class="wire"/>
  <line x1="230" y1="180" x2="160" y2="180" class="wire"/>
  <line x1="160" y1="180" x2="160" y2="385" class="wire"/>

  <!-- NMOS M3 (left load mirror, diode-connected) -->
  <use href="#nmos" x="90" y="285"/>
  <text x="90" y="337" text-anchor="middle" class="label">M3</text>

  <!-- M3 Gate-Drain Short (diode connection) -->
  <line x1="40" y1="285" x2="90" y2="285" class="wire-gate"/>
  <line x1="40" y1="255" x2="40" y2="285" class="wire-gate"/>

  <!-- NMOS M4 (right load mirror) -->
  <use href="#nmos" x="230" y="285"/>
  <text x="230" y="337" text-anchor="middle" class="label">M4</text>

  <!-- M3 Gate to M4 Gate (current mirror connection) -->
  <line x1="40" y1="285" x2="230" y2="285" class="wire-gate"/>
  <line x1="230" y1="255" x2="230" y2="285" class="wire-gate"/>

  <!-- Vout from M2/M4 drain -->
  <line x1="230" y1="200" x2="310" y2="200" class="wire"/>
  <text x="320" y="195" text-anchor="start" class="vout">Vout</text>

  <!-- NMOS M5 (tail current source) -->
  <use href="#nmos" x="160" y="415"/>
  <text x="160" y="467" text-anchor="middle" class="label">M5</text>

  <!-- M5 Gate -->
  <line x1="100" y1="415" x2="138" y2="415" class="wire"/>
  <text x="80" y="410" text-anchor="end" class="label">Vbias</text>

  <!-- M5 Source to GND -->
  <line x1="160" y1="441" x2="160" y2="485" class="wire"/>

  <!-- GND Symbol -->
  <line x1="100" y1="485" x2="220" y2="485" class="gnd" stroke-width="3"/>
  <line x1="120" y1="493" x2="200" y2="493" class="gnd"/>
  <line x1="135" y1="501" x2="185" y2="501" class="gnd"/>
  <text x="230" y="490" text-anchor="start" class="label">GND</text>

  <!-- Annotations -->
  <text x="35" y="100" text-anchor="start" class="small">(Diff Pair)</text>
  <text x="35" y="272" text-anchor="start" class="small">(Load Mirror)</text>
  <text x="35" y="405" text-anchor="start" class="small">(Tail Current)</text>

  <!-- Legend -->
  <rect x="280" y="440" width="110" height="70" rx="3" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="335" y="458" text-anchor="middle" font-size="10" font-weight="bold">Legend</text>
  <rect x="290" y="465" width="18" height="12" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="314" y="475" font-size="9" fill="#555">PMOS</text>
  <rect x="290" y="483" width="18" height="12" fill="#eee" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="314" y="493" font-size="9" fill="#555">NMOS</text>
</svg>