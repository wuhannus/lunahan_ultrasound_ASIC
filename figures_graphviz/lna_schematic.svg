<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 13px; fill: #555; }
      .label { font-size: 13px; font-weight: bold; fill: #1a1a1a; }
      .small { font-size: 10px; fill: #666; }
      .wire { stroke: #1a1a1a; stroke-width: 2; fill: none; }
      .wire-vdd { stroke: #cc0000; stroke-width: 2.5; fill: none; }
      .wire-bias { stroke: #006600; stroke-width: 1.5; fill: none; }
      .nm { fill: #f5f5f5; stroke: #1a1a1a; stroke-width: 2; }
      .pm { fill: #fff; stroke: #1a1a1a; stroke-width: 2; }
    </style>
    <!-- NMOS symbol (3-terminal: d,g,s) -->
    <g id="nmos">
      <rect x="-25" y="-22" width="50" height="44" rx="1" class="nm"/>
      <line x1="0" y1="-22" x2="0" y2="-35" class="wire"/>
      <line x1="0" y1="22" x2="0" y2="38" class="wire"/>
      <line x1="-35" y1="0" x2="-25" y2="0" class="wire"/>
    </g>
    <!-- PMOS symbol (3-terminal with gate circle) -->
    <g id="pmos">
      <rect x="-25" y="-22" width="50" height="44" rx="1" class="pm"/>
      <line x1="0" y1="-22" x2="0" y2="-35" class="wire"/>
      <line x1="0" y1="22" x2="0" y2="38" class="wire"/>
      <line x1="-35" y1="0" x2="-25" y2="0" class="wire"/>
      <circle cx="-38" cy="0" r="3" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
    </g>
    <!-- Diode-connected NMOS -->
    <g id="nmos_diode">
      <use href="#nmos"/>
      <line x1="-35" y1="0" x2="-35" y2="-35" class="wire-bias"/>
      <circle cx="-35" cy="-35" r="2" fill="#1a1a1a"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="#fff"/>

  <!-- Title -->
  <rect x="150" y="10" width="600" height="40" rx="3" fill="#e8f0fe" stroke="#2d5aa0" stroke-width="1.5"/>
  <text x="450" y="36" text-anchor="middle" class="title">LNA Schematic — Yaohua Zhang 40dB @ 1.5V (sky130)</text>

  <!-- ===== VDD Rail ===== -->
  <line x1="30" y1="70" x2="870" y2="70" class="wire-vdd"/>
  <text x="880" y="66" class="label" fill="#cc0000">VDD</text>

  <!-- ===== BIAS CIRCUIT (left side) ===== -->
  <text x="40" y="95" class="subtitle">PTAT Bias</text>

  <!-- Bias PMOS M_b1 (diode) -->
  <use href="#pmos" x="70" y="130"/>
  <line x1="35" y1="130" x2="45" y2="130" class="wire-bias"/>
  <line x1="35" y1="130" x2="35" y2="112" class="wire-bias"/>
  <circle cx="35" cy="112" r="2" fill="#1a1a1a"/>
  <line x1="70" y1="95" x2="70" y2="70" class="wire"/>
  <text x="70" y="55" text-anchor="middle" class="small">M_b1 (4u/1u M4)</text>

  <!-- Bias PMOS M_b2 (mirror out) -->
  <use href="#pmos" x="70" y="210"/>
  <line x1="35" y1="210" x2="45" y2="210" class="wire-bias"/>
  <line x1="35" y1="130" x2="35" y2="210" class="wire-bias"/>
  <line x1="70" y1="175" x2="70" y2="70" class="wire"/>
  <text x="80" y="230" text-anchor="start" class="small">M_b2 (20u/1u M2)</text>

  <!-- Bias NMOS M_b3 -->
  <use href="#nmos" x="70" y="290"/>
  <line x1="35" y1="290" x2="45" y2="290" class="wire-bias"/>
  <line x1="35" y1="270" x2="35" y2="290" class="wire-bias"/>
  <line x1="70" y1="255" x2="70" y2="268" class="wire"/>
  <text x="80" y="310" text-anchor="start" class="small">M_b3 (4u/1u M16)</text>

  <!-- Bias NMOS M_b4 -->
  <use href="#nmos" x="70" y="370"/>
  <line x1="70" y1="335" x2="70" y2="348" class="wire"/>
  <line x1="170" y1="370" x2="185" y2="370" class="wire-bias"/>
  <line x1="185" y1="370" x2="185" y2="290" class="wire-bias"/>
  <text x="80" y="390" text-anchor="start" class="small">M_b4 (4u/1u M16)</text>

  <!-- ===== CORE AMPLIFIER (center) ===== -->
  <text x="440" y="95" class="subtitle">Core Amplifier</text>

  <!-- M1 NMOS Input -->
  <use href="#nmos" x="380" y="130"/>
  <line x1="380" y1="95" x2="380" y2="108" class="wire"/>
  <line x1="380" y1="152" x2="380" y2="190" class="wire"/>
  <text x="380" y="215" text-anchor="middle" class="label">M1 (5u/0.5u M40)</text>

  <!-- MCAS Cascode NMOS -->
  <use href="#nmos" x="380" y="250"/>
  <line x1="380" y1="215" x2="380" y2="228" class="wire"/>
  <line x1="380" y1="272" x2="380" y2="310" class="wire"/>
  <text x="380" y="335" text-anchor="middle" class="label">MCAS (5u/0.5u M40)</text>

  <!-- M2 PMOS Load (right side) -->
  <use href="#pmos" x="530" y="190"/>
  <line x1="530" y1="155" x2="530" y2="70" class="wire"/>
  <line x1="530" y1="212" x2="530" y2="250" class="wire"/>
  <text x="540" y="260" text-anchor="start" class="label">M2 (4u/0.5u M28)</text>

  <!-- M1-MCAS-M2 connections -->
  <line x1="380" y1="152" x2="530" y2="152" class="wire"/>
  <line x1="530" y1="152" x2="530" y2="168" class="wire"/>
  <line x1="380" y1="272" x2="530" y2="272" class="wire"/>
  <line x1="530" y1="272" x2="530" y2="250" class="wire"/>

  <!-- Vin -->
  <line x1="345" y1="130" x2="355" y2="130" class="wire"/>
  <text x="320" y="125" text-anchor="end" class="label">Vin</text>

  <!-- ===== OUTPUT STAGE (right) ===== -->
  <text x="640" y="95" class="subtitle">Output Stage</text>

  <!-- M3 Source Follower -->
  <use href="#nmos" x="680" y="340"/>
  <line x1="680" y1="305" x2="680" y2="318" class="wire"/>
  <line x1="680" y1="362" x2="680" y2="400" class="wire"/>
  <text x="680" y="420" text-anchor="middle" class="label">M3 (10u/0.5u M6)</text>

  <!-- M_load -->
  <use href="#nmos" x="780" y="340"/>
  <line x1="780" y1="305" x2="780" y2="318" class="wire"/>
  <line x1="780" y1="362" x2="780" y2="400" class="wire"/>
  <text x="780" y="420" text-anchor="middle" class="label">ML (2u/2u M2)</text>

  <!-- M3 to M_load -->
  <line x1="680" y1="380" x2="780" y2="380" class="wire"/>

  <!-- Output from MCAS drain to M3 gate -->
  <line x1="530" y1="272" x2="700" y2="272" class="wire"/>
  <line x1="700" y1="272" x2="700" y2="310" class="wire"/>
  <line x1="700" y1="310" x2="680" y2="310" class="wire"/>

  <!-- Vout -->
  <line x1="750" y1="275" x2="850" y2="275" class="wire"/>
  <text x="860" y="270" class="label" fill="#cc0000">Vout</text>

  <!-- M3 drain to VDD -->
  <line x1="680" y1="310" x2="680" y2="70" class="wire"/>

  <!-- ===== GND ==== -->
  <line x1="30" y1="470" x2="870" y2="470" class="wire" stroke-width="2.5"/>
  <text x="880" y="466" class="label">GND</text>

  <!-- M1 source, MCAS source to GND?? No — M1 source goes to MCAS, MCAS drain to M2 -->
  <!-- Actually: M1 source is at signal ground via bias path -->
  <line x1="380" y1="152" x2="130" y2="152" class="wire"/>
  <line x1="130" y1="152" x2="130" y2="470" class="wire"/>
  <line x1="380" y1="380" x2="380" y2="470" class="wire"/>
  <line x1="780" y1="380" x2="780" y2="470" class="wire"/>

  <!-- ===== GATE BIAS (bottom center) ===== -->
  <text x="310" y="510" class="subtitle">Gate Bias Voltages (from PTAT reference)</text>

  <!-- V_cas bias generator -->
  <use href="#pmos" x="250" y="550"/>
  <line x1="215" y1="550" x2="225" y2="550" class="wire-bias"/>
  <line x1="215" y1="550" x2="215" y2="535" class="wire-bias"/>
  <circle cx="215" cy="535" r="2" fill="#1a1a1a"/>
  <line x1="250" y1="515" x2="250" y2="470" class="wire"/>
  <text x="250" y="595" text-anchor="middle" class="small">V_cas (4u/2u)</text>

  <use href="#nmos" x="370" y="550"/>
  <line x1="345" y1="550" x2="360" y2="550" class="wire-bias"/>
  <line x1="345" y1="550" x2="345" y2="530" class="wire-bias"/>
  <line x1="370" y1="515" x2="370" y2="470" class="wire"/>
  <text x="370" y="595" text-anchor="middle" class="small">V_cas2 (4u/2u)</text>

  <use href="#pmos" x="490" y="550"/>
  <line x1="455" y1="550" x2="465" y2="550" class="wire-bias"/>
  <line x1="455" y1="550" x2="455" y2="535" class="wire-bias"/>
  <circle cx="455" cy="535" r="2" fill="#1a1a1a"/>
  <line x1="490" y1="515" x2="490" y2="470" class="wire"/>
  <text x="490" y="595" text-anchor="middle" class="small">V_bp (4u/2u)</text>

  <use href="#pmos" x="600" y="550"/>
  <line x1="565" y1="550" x2="575" y2="550" class="wire-bias"/>
  <line x1="565" y1="550" x2="565" y2="535" class="wire-bias"/>
  <circle cx="565" cy="535" r="2" fill="#1a1a1a"/>
  <line x1="600" y1="515" x2="600" y2="470" class="wire"/>
  <text x="600" y="595" text-anchor="middle" class="small">V_sf (4u/2u)</text>

  <!-- Legend -->
  <rect x="30" y="620" width="280" height="65" rx="3" fill="#fafafa" stroke="#ccc"/>
  <text x="170" y="640" text-anchor="middle" font-size="11" font-weight="bold">Legend</text>
  <rect x="45" y="650" width="22" height="14" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="50" cy="664" r="3" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="663" font-size="10" fill="#555">PMOS (gate circle)</text>
  <rect x="170" y="650" width="22" height="14" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="663" font-size="10" fill="#555">NMOS</text>
  <rect x="45" y="672" width="6" height="6" fill="#006600"/>
  <text x="58" y="678" font-size="9" fill="#555">Diode connection</text>

  <!-- Specs -->
  <rect x="400" y="620" width="470" height="65" rx="3" fill="#e8f0fe" stroke="#2d5aa0" stroke-width="1"/>
  <text x="635" y="640" text-anchor="middle" font-size="11" font-weight="bold" fill="#2d5aa0">Design Specs (Yaohua Zhang)</text>
  <text x="420" y="660" font-size="10" fill="#333">Gain: 40 dB @ 1.5V | NF: 2.5 dB | IRN: 2.0 nV/rtHz</text>
  <text x="420" y="677" font-size="10" fill="#333">BW: 10 kHz - 200 kHz | Power: &lt;1 mW | sky130 PDK | M param fingers</text>
</svg>
